[package]
name = "wikloom"
version = "0.2.0"
description = "Wikloom — 本地优先的个人知识库"
authors = ["Wikloom"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wikloom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
